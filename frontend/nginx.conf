# nginx do container: serve o SPA e faz proxy do /api para a API.
# Fica atrás do Traefik do Dokploy, que faz TLS e alcança este container pelo nome.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: /api/* → a api (a barra final no proxy_pass remove o prefixo /api).
    #
    # `pvn-finance-api` e não `api`: este container fica na `dokploy-network`,
    # compartilhada com todos os outros projetos da VPS. Um nome genérico como
    # `api` pode resolver para o container de OUTRO projeto que use o mesmo nome
    # de serviço — já aconteceu aqui com `frontend`, e o sintoma foi um 502 que
    # não aponta para DNS nenhum. O alias está declarado no compose.
    location /api/ {
        proxy_pass http://pvn-finance-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React Router caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache dos assets com hash no nome (imutáveis)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
